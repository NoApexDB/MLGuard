[project]
name = "mlguard"
version = "1.0.0"
description = "Линтер для предиктивной аналитики бизнеса: находит методологические и статистические ловушки в данных до того, как они попадут в прод."


readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "pyarrow>=14.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
mlguard = "mlguard.core.cli:cli"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mlguard*"]
